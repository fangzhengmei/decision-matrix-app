<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>决策矩阵工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>决策矩阵工具</h1>
        
        <div class="section">
            <h2>1. 添加评分维度</h2>
            <div class="input-group">
                <input type="text" id="dimensionName" placeholder="维度名称">
                <input type="number" id="dimensionWeight" placeholder="权重" min="1" value="1">
                <button onclick="addDimension()">添加维度</button>
            </div>
            <div id="dimensionsList" class="list"></div>
        </div>

        <div class="section">
            <h2>2. 添加备选方案</h2>
            <div class="input-group">
                <input type="text" id="alternativeName" placeholder="方案名称">
                <button onclick="addAlternative()">添加方案</button>
            </div>
            <div id="alternativesList" class="list"></div>
        </div>

        <div class="section">
            <h2>3. 评分矩阵</h2>
            <div id="scoringMatrix" class="matrix"></div>
        </div>

        <div class="section">
            <h2>4. 排名结果</h2>
            <button onclick="calculateRankings()">计算排名</button>
            <div id="rankings" class="rankings"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
